# =============================================================================
# 归档 fork：补齐历史版本的 Release（说明 + 产物 + Docker 镜像）
# =============================================================================
# 上游 NapNeko/NapCatQQ 的 tag / Release，以及 NapCat-Docker、NapCatResource 等
# 配套仓库都已删除，本工作流在 fork 里按 tag 重建 Release：
#
#   说明    尽量还原上游原文，见 .github/mirror/notes.py
#           （v4.18.38 起用原脚本重新生成＝逐字一致；更早的是发布时 AI 生成的，从存档找回）
#   重新构建  NapCat.Shell.zip / NapCat.Framework.zip / NapCat.Shell.Windows.Node.zip
#           用该 tag 自己的源码，按该 tag 自己 release workflow 里的配方
#           （Node / pnpm 版本、QQ 安装包地址与校验值、拷贝的 QQ 文件列表）
#   拉原包    NapCat.Shell.Windows.OneKey.zip（资源仓库已删，无法构建），以及构建失败的产物
#           → 依次从 ASSET_MIRRORS 里同名 tag 的 Release 下载
#   Docker   Docker Hub 上的原镜像已删 → 重新构建，amd64 / arm64 各在原生机器上构建（不用 QEMU 模拟）：
#           用 NapCat-Docker 的 fork（完整保留了历史），取该版本发布时的那一版
#           Dockerfile / base / entrypoint（含当时锁定的 LinuxQQ），放入该版本的 NapCat.Shell.zip。
#           ① 导出 `docker load -i xxx.tar` 可直接导入的 tar（镜像名仍是 mlikiowa/napcat-docker:<tag>），附 .sha256
#           ② 推送到 GHCR：ghcr.io/<你的用户名>/napcat-docker:<tag>（多架构，最新版另打 latest）
#
# 流程：prepare（说明、建 Release）→ release（每版本打包 zip）→ docker（每版本×架构）→ ghcr（合并多架构标签）
#
# 建议用法：
#   1. mode=dry-run   先只生成说明，在运行汇总 / artifact 里检查
#   2. mode=notes-only 把已存在的 Release 说明改回原文
#   3. mode=full      补齐缺的 Release（可重复运行，已有的默认跳过）
#
# 可选 secrets：
#   NEWRELEASES_API_KEY   newreleases.io API key，找回说明更稳（没有就抓页面）
# =============================================================================

name: Mirror Releases

on:
  workflow_dispatch:
    inputs:
      tags:
        description: '处理哪些版本：all，或空格/逗号分隔的 tag，如 v4.17.23 v4.18.42'
        default: all
      min_version:
        description: 'tags=all 时的最低版本'
        default: v4.15.0
      mode:
        description: 'dry-run=只生成说明供检查 / notes-only=只改已有 Release 的说明 / full=构建并发布'
        type: choice
        options: [dry-run, notes-only, full]
        default: dry-run
      skip_existing:
        description: 'full 模式下跳过文件已齐全的 Release（缺文件的会继续补，可放心重复运行）'
        type: boolean
        default: true
      link_repo:
        description: '说明里提交/对比链接指向的仓库。留空 = 本仓库（链接可点）；填 NapNeko/NapCatQQ = 与原文逐字一致（链接已失效）'
        default: ''

permissions:
  contents: write
  packages: write   # 推送 GHCR

concurrency:
  group: mirror-releases
  cancel-in-progress: false

env:
  UPSTREAM: NapNeko/NapCatQQ
  # 说明里的文档链接 https://napneko.github.io/... 换成自己的文档站（路径不变）；留空则保持原链接
  DOCS_URL: https://xtfg.github.io/NapCatDocs/
  # tar 里的镜像名保持原样，docker load 后与原来的 compose 配置通用
  DOCKER_IMAGE: mlikiowa/napcat-docker
  # GHCR 上的包名：ghcr.io/<仓库所有者>/<这个名字>
  GHCR_NAME: napcat-docker
  # 保留了 NapNeko/NapCat-Docker 完整历史的 fork，依次尝试
  DOCKER_SRC_REPOS: XTFG/NapCat-Docker BB0813/NapCat-Docker synodriver/NapCat-Docker
  # 拉原包时依次尝试的仓库：在这些仓库里找同名 tag 的 Release 资产
  ASSET_MIRRORS: XingYunStar/NapCatQQ 5wthf/NapCatQQ xuyuan985-star/NapCatQQ wlz-remake/NapCatQQ
  # OneKey 原本每次发布时取自 NapCatResource（已删、无 fork），整个期间只换过一次：
  # v4.18.30 起内置 QQ 升级到 9.9.33（之前的旧版因腾讯下架旧 QQ 已装不上）。
  # 格式 起始版本=取自哪个版本的 Release，从新到旧排列；在本仓库和 ASSET_MIRRORS 里找该版本的 OneKey
  ONEKEY_MAP: v4.18.30=v4.18.42 v0.0.0=v4.18.19
  # 旧版 QQ 安装包已从腾讯 CDN 下架。原地址不通时按下表找镜像，并核对是同一个文件：
  #   Windows：原地址目录名就是文件 MD5 的前 8 位（有 SHA256 的用 SHA256）
  #   Linux  ：deb 里的版本号（含构建号）必须和原文件名一致
  # 格式：原文件名（Linux 写版本号）  镜像地址…（Linux 地址里的 ${arch} 会换成 amd64 / arm64）
  QQ_WIN_MIRRORS: |
    QQ9.9.32.50969_x64.exe https://github.com/Rodert/qq-versions/releases/download/qq-packages-20260720-ffedf7c6/QQ_9.9.32_260716_x64_01.exe
  QQ_LINUX_MIRRORS: |
    3.2.21-42086 https://github.com/zydou/QQ-Linux/releases/download/3.2.21-251114/QQ-3.2.21-251114-${arch}.deb
    3.2.25-45758 https://github.com/zydou/QQ-Linux/releases/download/3.2.25-260205/QQ-3.2.25-260205-${arch}.deb
    3.2.28-48517 https://github.com/zydou/QQ-Linux/releases/download/3.2.28-260429/QQ-3.2.28-260429-${arch}.deb

jobs:
  # ---------------------------------------------------------------------------
  # 选 tag → 找回说明 → 按版本顺序创建 / 更新 Release（保证 Releases 页面顺序正确）
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_matrix: ${{ steps.notes.outputs.release_matrix }}
      release_count: ${{ steps.notes.outputs.release_count }}
      docker_matrix: ${{ steps.notes.outputs.docker_matrix }}
      docker_count: ${{ steps.notes.outputs.docker_count }}
      tag_dates: ${{ steps.notes.outputs.tag_dates }}
      latest: ${{ steps.plan.outputs.latest }}
      ghcr_image: ${{ steps.plan.outputs.ghcr_image }}
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: 20.x

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc
          python -m pip install -q beautifulsoup4

      - name: Log in to GHCR
        if: inputs.mode == 'full'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          IN_TAGS: ${{ inputs.tags }}
          MIN_VERSION: ${{ inputs.min_version }}
          MODE: ${{ inputs.mode }}
          SKIP_EXISTING: ${{ inputs.skip_existing }}
        run: |
          semver='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          all=$(git tag -l 'v*' | grep -E "$semver" | sort -V)
          latest=$(tail -n1 <<<"$all")

          if [ "$IN_TAGS" = all ]; then
            : > selected.txt
            while read -r t; do
              if [ "$(printf '%s\n%s\n' "$MIN_VERSION" "$t" | sort -V | head -n1)" = "$MIN_VERSION" ]; then
                echo "$t" >> selected.txt
              fi
            done <<<"$all"
          else
            tr ',' ' ' <<<"$IN_TAGS" | tr -s ' \t' '\n' | sed '/^$/d' | sort -V | uniq > selected.txt
            while read -r t; do
              git rev-parse -q --verify "refs/tags/$t" >/dev/null || { echo "::error::tag $t 不存在"; exit 1; }
            done < selected.txt
          fi

          ghcr_image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$GHCR_NAME"
          echo "ghcr_image=$ghcr_image" >> "$GITHUB_OUTPUT"

          # 现有 Release 及其文件，zip 和 Docker 分开判断是否齐全，重新运行时只补缺的部分：
          #   zip 齐全    = Shell / Framework / OneKey 都在（Windows.Node 依赖的 QQ 安装包很多已下架，不强求）
          #   Docker 齐全 = 本版本的 amd64/arm64 tar 都在（-fallback- 的替代镜像不算）且 GHCR 上已有该标签
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            -q '.[] | [.tag_name, ([.assets[].name] | join(" "))] | @tsv' > releases.tsv
          cut -f1 releases.tsv | sort > existing.txt
          awk -F'\t' '{
            n = split($2, a, " "); delete h; for (i = 1; i <= n; i++) h[a[i]] = 1
            if (("NapCat.Shell.zip" in h) && ("NapCat.Framework.zip" in h) && ("NapCat.Shell.Windows.OneKey.zip" in h)) print $1
          }' releases.tsv | sort > zips_complete.txt
          awk -F'\t' '{
            n = split($2, a, " "); delete h; for (i = 1; i <= n; i++) h[a[i]] = 1
            if ((("napcat-docker-" $1 "-amd64.tar") in h) && (("napcat-docker-" $1 "-arm64.tar") in h)) print $1
          }' releases.tsv | sort > tars_complete.txt
          sort selected.txt > selected.sorted
          : > docker_complete.txt
          if [ "$MODE" = full ]; then
            while read -r t; do
              if docker buildx imagetools inspect "$ghcr_image:$t" >/dev/null 2>&1; then echo "$t" >> docker_complete.txt; fi
            done < <(comm -12 selected.sorted tars_complete.txt)
          fi
          sort -o docker_complete.txt docker_complete.txt
          comm -12 zips_complete.txt docker_complete.txt > complete.txt
          case "$MODE" in
            notes-only) comm -12 selected.sorted existing.txt | sort -V > tags.txt ;;
            full)
              if [ "$SKIP_EXISTING" = true ]; then comm -23 selected.sorted complete.txt | sort -V > tags.txt
              else cp selected.txt tags.txt; fi ;;
            *) cp selected.txt tags.txt ;;
          esac

          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "候选 $(grep -c . tags.txt || true) 个 tag（模式 $MODE），最新版本 $latest"
          cat tags.txt

      - name: Resolve original release notes
        id: notes
        env:
          MODE: ${{ inputs.mode }}
          SKIP_EXISTING: ${{ inputs.skip_existing }}
          LINK_REPO: ${{ inputs.link_repo || github.repository }}
          NEWRELEASES_API_KEY: ${{ secrets.NEWRELEASES_API_KEY }}
          NOTES_DEBUG_DIR: notes/debug   # 提取失败时保存原页面，随说明包一起上传
        run: |
          mkdir -p notes
          : > notes/sources.tsv
          {
            echo "### Release 说明来源"
            echo
            echo "| 版本 | 来源 |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          while read -r t; do
            [ -n "$t" ] || continue
            src=$(python .github/mirror/notes.py --tag "$t" --repo-dir . --out "notes/$t.md" --link-repo "$LINK_REPO" --docs-url "$DOCS_URL")
            printf '%s\t%s\n' "$t" "$src" >> notes/sources.tsv
            echo "| $t | $src |" >> "$GITHUB_STEP_SUMMARY"
            case "$src" in newreleases|wayback) sleep 2 ;; esac
          done < tags.txt
          {
            echo
            echo "generator = 用原脚本重新生成（逐字一致）；newreleases / wayback = 从存档找回；"
            echo "override = 手工文件 release-notes/<tag>.md；**fallback = 没找回（有来源出错，没法下结论），按提交记录生成，照常发布**；"
            echo "**unreleased = newreleases 和 Wayback 都明确没有记录 → 上游没正式发布过，不建 Release、不构建**"
          } >> "$GITHUB_STEP_SUMMARY"

          # 去掉上游没正式发布过的版本（想强制发布：放一份 release-notes/<tag>.md）
          awk -F'\t' 'FILENAME == ARGV[1] { if ($2 == "unreleased") skip[$1] = 1; next } $0 != "" && !($0 in skip)' \
            notes/sources.tsv tags.txt > tags.final
          unreleased=$(awk -F'\t' '$2 == "unreleased" { print $1 }' notes/sources.tsv)
          if [ -n "$unreleased" ]; then
            {
              echo
              echo "#### 上游未正式发布、已跳过的版本"
              echo
              for t in $unreleased; do echo "- $t"; done
            } >> "$GITHUB_STEP_SUMMARY"
            for t in $unreleased; do
              if grep -qx "$t" existing.txt; then
                echo "::warning::$t 上游没正式发布过，但本仓库已有它的 Release（工作流不会删），需要的话请手动删除"
              fi
            done
          fi

          # 两个阶段各自要处理的版本：zip 阶段跳过 zip 已齐全的，Docker 阶段跳过镜像已齐全的
          if [ "$MODE" = full ] && [ "$SKIP_EXISTING" = true ]; then
            comm -23 <(sort tags.final) zips_complete.txt | sort -V > release.list
            comm -23 <(sort tags.final) docker_complete.txt | sort -V > docker.list
          else
            cp tags.final release.list
            cp tags.final docker.list
          fi
          release_count=$(grep -c . release.list || true)
          docker_count=$(grep -c . docker.list || true)
          if [ "$MODE" = full ] && { [ "$release_count" -gt 256 ] || [ "$docker_count" -gt 128 ]; }; then
            echo "::error::矩阵上限 256 个任务（Docker 每个版本占 2 个），当前 zip $release_count 个、Docker $docker_count 个版本，请用 tags / min_version 分批"; exit 1
          fi
          # Docker 阶段按发布时间（打 tag 的时间）找当时的配方
          while read -r t; do
            [ -n "$t" ] || continue
            ts=$(git for-each-ref --format='%(taggerdate:unix)' "refs/tags/$t")
            [ -n "$ts" ] || ts=$(git log -1 --format=%ct "$t^{commit}")
            printf '%s\t%s\n' "$t" "$ts"
          done < docker.list > tag_dates.tsv
          {
            echo "release_count=$release_count"
            echo "release_matrix=$(jq -R . release.list | jq -sc .)"
            echo "docker_count=$docker_count"
            echo "docker_matrix=$(jq -R . docker.list | jq -sc .)"
            echo "tag_dates=$(jq -Rn '[inputs | split("\t") | {(.[0]): (.[1] | tonumber)}] | add // {}' -c < tag_dates.tsv)"
          } >> "$GITHUB_OUTPUT"
          echo "共 $(grep -c . tags.final || true) 个版本：打包 zip $release_count 个，构建 Docker $docker_count 个；跳过未发布的 $(grep -c . <<<"$unreleased" || true) 个"

      - name: Upload notes
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: notes/
          if-no-files-found: ignore

      - name: Create / update releases in version order
        if: inputs.mode != 'dry-run'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          LATEST: ${{ steps.plan.outputs.latest }}
        run: |
          while read -r t; do
            [ -n "$t" ] || continue
            if grep -qx "$t" existing.txt; then
              echo "更新说明 $t"
              gh release edit "$t" --title "NapCat $t" --notes-file "notes/$t.md"
            elif [ "$MODE" = full ]; then
              echo "创建 $t"
              flag=--latest=false
              [ "$t" = "$LATEST" ] && flag=--latest
              gh release create "$t" --verify-tag --title "NapCat $t" --notes-file "notes/$t.md" "$flag"
            fi
            sleep 2   # 避开创建类 API 的速率限制
          done < tags.final

  # ---------------------------------------------------------------------------
  # 每个版本：重新构建 zip / 拉原包 → 上传
  # ---------------------------------------------------------------------------
  release:
    needs: prepare
    if: inputs.mode == 'full' && needs.prepare.outputs.release_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        tag: ${{ fromJSON(needs.prepare.outputs.release_matrix) }}
    env:
      TAG: ${{ matrix.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REPORT: ${{ github.workspace }}/../report.tsv
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: Checkout ${{ matrix.tag }}
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ matrix.tag }}
          persist-credentials: false

      - name: Download notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes

      # 从该 tag 自己的 release workflow 里读出当时的构建配方
      - name: Detect original recipe
        id: tc
        run: |
          : > "$REPORT"
          wf=.github/workflows/release-publish.yml
          [ -f "$wf" ] || wf=.github/workflows/release.yml
          if [ ! -f "$wf" ]; then echo "::warning::$TAG 没有 release workflow，用默认配方"; wf=/dev/null; fi

          node=$(grep -oE "node-version: *['\"]?[0-9][0-9.x]*" "$wf" | head -n1 | grep -oE '[0-9][0-9.x]*$' || true)
          if grep -q 'npm i -g pnpm' "$wf"; then
            pnpm=10   # 当时装的是最新版 pnpm（10.x）
          else
            pnpm=$(grep -A4 'pnpm/action-setup' "$wf" | grep -oE 'version: *[0-9]+' | head -n1 | grep -oE '[0-9]+' || true)
          fi
          qq_url=$(grep -oE 'https://[^"'"'"' ]+\.exe' "$wf" | head -n1 || true)
          qq_sha=$(grep -oE 'QQ_SHA256: *[0-9a-f]{64}' "$wf" | head -n1 | grep -oE '[0-9a-f]{64}' || true)
          node_win=$(grep -oE "NODE_VER(SION)?[:=] *['\"]?[0-9]+\.[0-9]+\.[0-9]+" "$wf" | head -n1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          targets=$(grep -oE 'QQ_TARGETS=\(.*\)' "$wf" | head -n1 | grep -oE '"[^"]+"' | tr -d '"' | tr '\n' ' ' || true)
          first_match=0; grep -q -- '-print -quit' "$wf" && first_match=1
          win64=0;       grep -q 'win64/' "$wf" && win64=1
          deldev=0;      grep -q 'npm pkg delete devDependencies' "$wf" && deldev=1

          {
            echo "node=${node:-20.x}"
            echo "pnpm=${pnpm:-9}"
            echo "qq_url=$qq_url"
            echo "qq_sha=$qq_sha"
            echo "node_win=${node_win:-22.11.0}"
            echo "targets=${targets:-avif_convert.dll broadcast_ipc.dll config.json libglib-2.0-0.dll libgobject-2.0-0.dll libvips-42.dll ncnn.dll opencv.dll package.json QBar.dll wrapper.node LightQuic.dll}"
            echo "first_match=$first_match"
            echo "win64=$win64"
            echo "deldev=$deldev"
          } | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.tc.outputs.node }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.tc.outputs.pnpm }}
          run_install: false

      - name: Install dependencies & build WebUI
        id: deps
        continue-on-error: true
        env:
          NAPCAT_VERSION: ${{ matrix.tag }}
          GITHUB_TOKEN: ''
        run: |
          pnpm i
          pnpm --filter napcat-webui-frontend run build

      - name: Rebuild NapCat.Shell
        id: shell
        if: steps.deps.outcome == 'success'
        continue-on-error: true
        env:
          NAPCAT_VERSION: ${{ matrix.tag }}
          GITHUB_TOKEN: ''
          DELDEV: ${{ steps.tc.outputs.deldev }}
        run: |
          pnpm run build:shell
          pnpm --filter napcat-plugin-builtin run build   # 会拷进 napcat-shell/dist/plugins
          mkdir -p out
          mv packages/napcat-shell/dist out/NapCat.Shell
          cd out/NapCat.Shell
          if [ "$DELDEV" = 1 ]; then npm pkg delete devDependencies; fi
          if ! npm install --omit=dev; then
            # 老版本今天会报 "Cannot read properties of null (reading 'edgesOut')"，
            # 上游在 v4.18.41 的修复就是先删 devDependencies，这里同样处理后重试
            echo "::warning::npm install --omit=dev 失败，删除 devDependencies 后重试（同上游 v4.18.41 的修复）"
            npm pkg delete devDependencies
            rm -rf node_modules package-lock.json
            npm install --omit=dev
          fi
          rm -f package-lock.json

      - name: Rebuild NapCat.Framework
        id: framework
        if: steps.deps.outcome == 'success'
        continue-on-error: true
        env:
          NAPCAT_VERSION: ${{ matrix.tag }}
          GITHUB_TOKEN: ''
          DELDEV: ${{ steps.tc.outputs.deldev }}
        run: |
          pnpm run build:framework
          mkdir -p out
          mv packages/napcat-framework/dist out/NapCat.Framework
          cd out/NapCat.Framework
          if [ "$DELDEV" = 1 ]; then npm pkg delete devDependencies; fi
          if ! npm install --omit=dev; then
            # 老版本今天会报 "Cannot read properties of null (reading 'edgesOut')"，
            # 上游在 v4.18.41 的修复就是先删 devDependencies，这里同样处理后重试
            echo "::warning::npm install --omit=dev 失败，删除 devDependencies 后重试（同上游 v4.18.41 的修复）"
            npm pkg delete devDependencies
            rm -rf node_modules package-lock.json
            npm install --omit=dev
          fi
          rm -f package-lock.json

      - name: Rebuild NapCat.Shell.Windows.Node
        id: winnode
        if: steps.shell.outcome == 'success' && steps.tc.outputs.qq_url != ''
        continue-on-error: true
        env:
          QQ_URL: ${{ steps.tc.outputs.qq_url }}
          QQ_SHA256: ${{ steps.tc.outputs.qq_sha }}
          NODE_WIN: ${{ steps.tc.outputs.node_win }}
          QQ_TARGETS: ${{ steps.tc.outputs.targets }}
          FIRST_MATCH: ${{ steps.tc.outputs.first_match }}
          WIN64: ${{ steps.tc.outputs.win64 }}
        run: |
          command -v 7z >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y -qq p7zip-full; }
          dl="$RUNNER_TEMP/dl"; qq="$RUNNER_TEMP/qq"; nd="$RUNNER_TEMP/node-win"
          mkdir -p "$dl" "$qq" "$nd"

          # QQ 安装包：先试原地址，已下架就按 QQ_WIN_MIRRORS 找镜像，核对是同一个文件
          name=$(basename "$QQ_URL")
          want_md5=$(sed -nE 's#.*/([0-9a-f]{8})/[^/]+$#\1#p' <<<"$QQ_URL")   # 原地址目录名 = MD5 前 8 位
          got=
          for u in "$QQ_URL" $(awk -v n="$name" '$1 == n { for (i = 2; i <= NF; i++) print $i }' <<<"$QQ_WIN_MIRRORS"); do
            rm -f "$dl/qq.exe"
            curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 1200 -A 'Mozilla/5.0' -o "$dl/qq.exe" "$u" || continue
            if [ -n "$QQ_SHA256" ]; then
              if ! echo "$QQ_SHA256  $dl/qq.exe" | sha256sum --check --strict -; then echo "::warning::$u 的 SHA256 对不上，不用"; continue; fi
            elif [ -n "$want_md5" ]; then
              md5=$(md5sum "$dl/qq.exe" | cut -c1-8)
              if [ "$md5" != "$want_md5" ]; then echo "::warning::$u 的 MD5 是 $md5…，原文件是 $want_md5…，不是同一个，不用"; continue; fi
            fi
            got=$u; break
          done
          if [ -z "$got" ]; then
            echo "::warning::QQ 安装包 $name 已下架，镜像里也没有同一个文件，无法重建 Windows.Node"
            echo "$name" > "$RUNNER_TEMP/qq_unavailable"
            exit 0
          fi
          [ "$got" = "$QQ_URL" ] || echo "$got" > "$RUNNER_TEMP/qq_mirror"
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 -o "$dl/node.zip" \
            "https://nodejs.org/dist/v$NODE_WIN/node-v$NODE_WIN-win-x64.zip"
          7z x -y -o"$qq" "$dl/qq.exe" >/dev/null
          unzip -q "$dl/node.zip" -d "$nd"

          out=out/NapCat.Shell.Windows.Node
          mkdir -p "$out"
          cp -a out/NapCat.Shell/. "$out/napcat/"
          for name in $QQ_TARGETS; do
            if [ "$FIRST_MATCH" = 1 ]; then
              f=$(find "$qq" -type f -iname "$name" -print -quit)
              if [ -z "$f" ]; then echo "::error::QQ 安装包里缺少 $name"; exit 1; fi
              cp -a "$f" "$out/"
            else
              find "$qq" -iname "$name" -exec cp -a {} "$out" \; || true
            fi
          done
          if [ ! -f "$out/wrapper.node" ]; then echo "::error::缺少 wrapper.node"; exit 1; fi
          if [ "$WIN64" = 1 ]; then
            mkdir -p "$out/win64"
            for n in SSOShareInfoHelper64.dll parent-ipc-core-x64.dll; do
              find "$qq" -ipath "*/win64/$n" -exec cp -a {} "$out/win64/" \; || true
            done
          fi
          for f in napcat.bat index.js QQNT.dll; do cp -a "packages/napcat-develop/$f" "$out/" || true; done
          cp -a "$nd/node-v$NODE_WIN-win-x64/node.exe" "$out/"
          rm -rf "$dl" "$qq" "$nd"

      - name: Package rebuilt zips
        run: |
          mkdir -p dist
          for n in NapCat.Shell NapCat.Framework NapCat.Shell.Windows.Node; do
            if [ -d "out/$n" ]; then
              (cd "out/$n" && zip -qr "$GITHUB_WORKSPACE/dist/$n.zip" .)
              note="重新构建"
              if [ "$n" = NapCat.Shell.Windows.Node ] && [ -f "$RUNNER_TEMP/qq_mirror" ]; then
                note="重新构建（QQ 安装包原地址已下架，用镜像 $(cat "$RUNNER_TEMP/qq_mirror")，已核对是同一个文件）"
              fi
              printf '%s\t%s\n' "$n.zip" "$note" >> "$REPORT"
            fi
          done
          rm -rf out node_modules packages/*/node_modules

      - name: Pull original packages (OneKey + failed rebuilds)
        run: |
          own=$(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null || true)
          for n in NapCat.Shell.zip NapCat.Framework.zip NapCat.Shell.Windows.Node.zip NapCat.Shell.Windows.OneKey.zip; do
            if [ -f "dist/$n" ]; then continue; fi
            if grep -qx "$n" <<<"$own"; then printf '%s\t%s\n' "$n" "保留 Release 里已有的文件" >> "$REPORT"; continue; fi
            got=
            for m in $ASSET_MIRRORS; do
              if gh release download "$TAG" -R "$m" -p "$n" -D dist --clobber 2>/dev/null; then got=$m; break; fi
            done
            if [ -n "$got" ]; then printf '%s\t%s\n' "$n" "原包（$got）" >> "$REPORT"; continue; fi

            if [ "$n" = NapCat.Shell.Windows.OneKey.zip ]; then
              # 按 ONEKEY_MAP 找到这个版本当时用的那一份
              use=""
              for kv in $ONEKEY_MAP; do
                from=${kv%%=*}
                if [ "$(printf '%s\n%s\n' "$from" "$TAG" | sort -V | head -n1)" = "$from" ]; then use=${kv#*=}; break; fi
              done
              if [ -n "$use" ]; then
                for r in "$GITHUB_REPOSITORY" $ASSET_MIRRORS; do
                  if gh release download "$use" -R "$r" -p "$n" -D dist --clobber 2>/dev/null; then got="$r 的 $use"; break; fi
                done
              fi
              if [ -n "$got" ]; then printf '%s\t%s\n' "$n" "原包（取自 $got，同一份资源文件）" >> "$REPORT"; continue; fi
            fi
            if [ "$n" = NapCat.Shell.Windows.Node.zip ] && [ -f "$RUNNER_TEMP/qq_unavailable" ]; then
              # 已知无法补齐的情况，不算失败（否则每次重跑都白跑）
              printf '%s\t%s\n' "$n" "跳过：依赖的 QQ 安装包 $(cat "$RUNNER_TEMP/qq_unavailable") 已下架，没有镜像，也没有原包" >> "$REPORT"
              continue
            fi
            printf '%s\t%s\n' "$n" "缺失" >> "$REPORT"
          done

      - name: Upload to release
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "NapCat $TAG" \
              --notes-file "$RUNNER_TEMP/notes/$TAG.md" --latest=false
          fi
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then echo "::warning::没有可上传的文件"; exit 0; fi
          ls -la dist
          for f in "${files[@]}"; do
            for _ in 1 2 3; do gh release upload "$TAG" "$f" --clobber && break; sleep 20; done
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "### $TAG"
            echo
            echo "| 文件 | 来源 |"
            echo "| --- | --- |"
            [ -f "$REPORT" ] && awk -F'\t' '{printf "| %s | %s |\n", $1, $2}' "$REPORT"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$REPORT" ] && grep -qE '缺失|失败' "$REPORT"; then
            echo "::error::$TAG 有产物没拿到，见汇总；可直接 Re-run failed jobs"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Docker：每个版本 × 架构一个任务，在对应架构的原生机器上构建
  #   → 导出 tar 上传到 Release，同时按 digest 推送到 GHCR（最后由 ghcr 任务合并成多架构标签）
  # ---------------------------------------------------------------------------
  docker:
    needs: [prepare, release]
    # zip 阶段有版本失败也照常运行；缺 NapCat.Shell.zip 的版本会在这里单独报错
    if: ${{ !cancelled() && inputs.mode == 'full' && needs.prepare.outputs.docker_count != '0' }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        tag: ${{ fromJSON(needs.prepare.outputs.docker_matrix) }}
        arch: [amd64, arm64]
    env:
      TAG: ${{ matrix.tag }}
      ARCH: ${{ matrix.arch }}
      TAG_TS: ${{ fromJSON(needs.prepare.outputs.tag_dates)[matrix.tag] }}
      GHCR_IMAGE: ${{ needs.prepare.outputs.ghcr_image }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: Prepare build context
        id: dk
        run: |
          # 该版本的 NapCat.Shell.zip（zip 阶段已上传到 Release）
          shell_zip="$RUNNER_TEMP/NapCat.Shell.zip"
          if ! gh release download "$TAG" -p NapCat.Shell.zip -O "$shell_zip" --clobber; then
            echo "::error::$TAG 的 Release 里没有 NapCat.Shell.zip（zip 阶段失败？先重跑它）"; exit 1
          fi
          unzip -tq "$shell_zip"

          src="$RUNNER_TEMP/napcat-docker"
          for r in $DOCKER_SRC_REPOS; do
            rm -rf "$src"
            if git clone -q --filter=blob:none "https://github.com/$r" "$src"; then repo=$r; break; fi
          done
          [ -n "${repo:-}" ] || { echo "::error::NapCat-Docker 的 fork 都拉不到"; exit 1; }

          # 发布时间 = 打 tag 的时间；取那之后 1 小时内 NapCat-Docker 的最新提交
          [ -n "$TAG_TS" ] || { echo "::error::没拿到 $TAG 的发布时间"; exit 1; }
          commit=$(git -C "$src" rev-list -1 --before="@$((TAG_TS + 3600))" HEAD)
          [ -n "$commit" ] || commit=$(git -C "$src" rev-list --max-parents=0 HEAD | tail -n1)
          git -C "$src" checkout -q "$commit"
          cp "$shell_zip" "$src/NapCat.Shell.zip"

          # base/Dockerfile 作为第一阶段（官方镜像改走 ECR Public 镜像源），
          # 原 Dockerfile 的 FROM mlikiowa/napcat-docker:base 改为引用该阶段
          {
            awk '/^FROM[ \t]/ && !done {
                   img = $2; if (img !~ /\//) img = "public.ecr.aws/docker/library/" img
                   print "FROM " img " AS napcat-base"; done = 1; next
                 } { print }' "$src/base/Dockerfile"
            echo
            sed -E 's#^FROM[[:space:]]+mlikiowa/napcat-docker:base([[:space:]].*)?$#FROM napcat-base#' "$src/Dockerfile"
          } > "$src/Dockerfile.archive"
          grep -q '^FROM napcat-base$' "$src/Dockerfile.archive" || { echo "::error::Dockerfile 结构不认识"; exit 1; }

          # LinuxQQ：原地址已下架时换成 QQ_LINUX_MIRRORS 里的镜像，并核对 deb 的版本号（含构建号）一致。
          # 核对过的 deb 在构建时临时挂载进去（RUN --mount），不新增镜像层，镜像大小与原来一样。
          mirrored=
          while read -r url; do
            [ -n "$url" ] || continue
            ver=$(sed -E 's#.*linuxqq_([0-9.]+-[0-9]+)_.*#\1#' <<<"$url")
            real=$(sed -E "s#\\\$\\{?arch\\}?#$ARCH#" <<<"$url")
            if curl -fsSL -r 0-0 -o /dev/null --connect-timeout 20 --max-time 60 "$real"; then
              echo "LinuxQQ $ver 原地址可用"; continue
            fi
            mirror=$(awk -v v="$ver" '$1 == v { print $2 }' <<<"$QQ_LINUX_MIRRORS")
            if [ -z "$mirror" ]; then
              # 构建不了：改拉原包，即备份仓库里该版本、该架构的原版镜像 tar（有 .sha256 就先校验）
              f="napcat-docker-$TAG-$ARCH.tar"
              for m in $ASSET_MIRRORS; do
                gh release download "$TAG" -R "$m" -p "$f" -D "$RUNNER_TEMP" --clobber 2>/dev/null || continue
                if gh release download "$TAG" -R "$m" -p "$f.sha256" -D "$RUNNER_TEMP" --clobber 2>/dev/null; then
                  if ! (cd "$RUNNER_TEMP" && sha256sum --check --strict "$f.sha256"); then
                    echo "::warning::$m 的 $f 校验不通过，不用"; rm -f "$RUNNER_TEMP/$f"; continue
                  fi
                fi
                echo "LinuxQQ $ver 已下架且没有镜像，改用 $m 保存的原版镜像 $f"
                {
                  echo "mode=original"
                  echo "info=原包（$m 保存的原版镜像；LinuxQQ $ver 已下架，无法重新构建）"
                } >> "$GITHUB_OUTPUT"
                exit 0
              done
              # 已知无法补齐的情况：标为跳过，不算失败（以后找到存档或原包，补进 QQ_LINUX_MIRRORS / ASSET_MIRRORS 再跑即可）
              echo "::warning::LinuxQQ $ver 已从腾讯 CDN 下架，没有镜像，备份仓库里也没有原版镜像，跳过"
              {
                echo "mode=unavailable"
                echo "info=跳过：LinuxQQ $ver 已下架，没有镜像，也没有原版镜像"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            mreal=$(sed -E "s#\\\$\\{?arch\\}?#$ARCH#" <<<"$mirror")
            curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 900 -o "$src/linuxqq.mirror.deb" "$mreal"
            got=$(dpkg-deb -f "$src/linuxqq.mirror.deb" Version)
            if [ "$got" != "$ver" ]; then
              echo "::error::镜像里的 LinuxQQ 版本是 $got，原来是 $ver，不是同一个包，不用"; exit 1
            fi
            python3 - "$src/Dockerfile.archive" "$url" <<'PY'
          import re, sys
          path, url = sys.argv[1], sys.argv[2]
          lines = open(path, encoding='utf-8').read().split('\n')
          i = next(n for n, l in enumerate(lines) if url in l)
          while not re.match(r'\s*RUN\b', lines[i], re.I):
              i -= 1
          mount = '--mount=type=bind,source=linuxqq.mirror.deb,target=/tmp/linuxqq.mirror.deb'
          if mount not in lines[i]:
              lines[i] = re.sub(r'^(\s*RUN)\b', r'\1 ' + mount, lines[i], count=1, flags=re.I)
          open(path, 'w', encoding='utf-8').write('\n'.join(lines).replace(url, 'file:///tmp/linuxqq.mirror.deb'))
          PY
            echo "LinuxQQ $ver 原地址已下架，改用镜像 $mirror（deb 版本号已核对一致）"
            mirrored="（原地址已下架，用 ${mirror%%/releases/*} 的镜像，版本号已核对）"
          done < <(grep -oE 'https?://[^ "'"'"']*linuxqq_[0-9.]+-[0-9]+_\$\{?arch\}?\.deb' "$src/Dockerfile.archive" | sort -u)

          qq=$(grep -oE '(linuxqq|QQ)_[0-9.]+[-_][0-9]+' "$src/Dockerfile" | head -n1 || true)
          {
            echo "mode=build"
            echo "context=$src"
            echo "base_hash=$(git -C "$src" rev-parse --short "HEAD:base/Dockerfile")"
            echo "info=$repo@$(git -C "$src" rev-parse --short HEAD)，LinuxQQ ${qq:-?}$mirrored"
          } | tee -a "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # 底座只有两种，先单独构建并写入缓存，后面各版本直接复用
      - name: Cache base image
        if: steps.dk.outputs.mode == 'build'
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.dk.outputs.context }}
          file: ${{ steps.dk.outputs.context }}/Dockerfile.archive
          target: napcat-base
          platforms: linux/${{ matrix.arch }}
          outputs: type=cacheonly
          cache-from: type=gha,scope=napcat-base-${{ steps.dk.outputs.base_hash }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=napcat-base-${{ steps.dk.outputs.base_hash }}-${{ matrix.arch }}

      - name: Build & push to GHCR (by digest)
        id: push
        if: steps.dk.outputs.mode == 'build'
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.dk.outputs.context }}
          file: ${{ steps.dk.outputs.context }}/Dockerfile.archive
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ matrix.tag }}
          outputs: type=image,name=${{ needs.prepare.outputs.ghcr_image }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=napcat-base-${{ steps.dk.outputs.base_hash }}-${{ matrix.arch }}

      # 同一份构建结果再导出成 tar（直接复用上一步的构建缓存，很快）
      - name: Export docker-load tar
        id: tar
        if: steps.dk.outputs.mode == 'build'
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.dk.outputs.context }}
          file: ${{ steps.dk.outputs.context }}/Dockerfile.archive
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ matrix.tag }}
          tags: ${{ env.DOCKER_IMAGE }}:${{ matrix.tag }}
          outputs: type=docker,dest=${{ runner.temp }}/napcat-docker-${{ matrix.tag }}-${{ matrix.arch }}.tar
          provenance: false
          sbom: false
          cache-from: type=gha,scope=napcat-base-${{ steps.dk.outputs.base_hash }}-${{ matrix.arch }}

      # 构建不了、改用原包的版本：把原版镜像 tar 按 digest 推到 GHCR（不留临时标签）
      - name: Push original image to GHCR (by digest)
        id: pushorig
        if: steps.dk.outputs.mode == 'original'
        continue-on-error: true
        run: |
          case "$(uname -m)" in x86_64) a=x86_64 ;; aarch64|arm64) a=arm64 ;; *) a=$(uname -m) ;; esac
          curl -fsSL --retry 3 \
            "https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_$a.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" crane
          f="$RUNNER_TEMP/napcat-docker-$TAG-$ARCH.tar"
          # 确认原包里的镜像就是这个架构
          cfg=$(tar -xOf "$f" manifest.json | jq -r '.[0].Config')
          img_arch=$(tar -xOf "$f" "$cfg" | jq -r '.architecture')
          if [ "$img_arch" != "$ARCH" ]; then echo "::error::原版镜像的架构是 $img_arch，不是 $ARCH"; exit 1; fi
          digest=$("$RUNNER_TEMP/crane" digest --tarball "$f")
          "$RUNNER_TEMP/crane" push "$f" "$GHCR_IMAGE@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Save digest
        if: steps.push.outcome == 'success' || steps.pushorig.outcome == 'success'
        env:
          DIGEST: ${{ steps.push.outputs.digest || steps.pushorig.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$DIGEST" > "$RUNNER_TEMP/digests/$TAG-$ARCH"

      - name: Upload digest
        if: steps.push.outcome == 'success' || steps.pushorig.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: digest-${{ matrix.tag }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          overwrite: true
          retention-days: 7

      - name: Upload tar to release
        id: up
        if: steps.tar.outcome == 'success' || (steps.dk.outcome == 'success' && steps.dk.outputs.mode == 'original')
        run: |
          f="napcat-docker-$TAG-$ARCH.tar"
          cd "$RUNNER_TEMP"
          [ -s "$f" ] || { echo "::error::$f 是空的"; exit 1; }
          sha256sum "$f" > "$f.sha256"
          for x in "$f" "$f.sha256"; do
            ok=
            for _ in 1 2 3; do if gh release upload "$TAG" "$x" --clobber; then ok=1; break; fi; sleep 20; done
            [ -n "$ok" ] || { echo "::error::上传 $x 失败"; exit 1; }
          done
          # 删掉以前用旧版本顶替的同架构 -fallback- 文件
          gh release view "$TAG" --json assets -q '.assets[].name' \
            | grep -E "^napcat-docker-$TAG-fallback-.*-$ARCH\.tar(\.sha256)?$" \
            | while read -r old; do echo "删除旧的替代镜像 $old"; gh release delete-asset "$TAG" "$old" -y; done || true

      - name: Summary
        if: always()
        env:
          INFO: ${{ steps.dk.outputs.info }}
          MODE: ${{ steps.dk.outputs.mode }}
          DK: ${{ steps.dk.outcome }}
          PUSH: ${{ steps.dk.outputs.mode == 'original' && steps.pushorig.outcome || steps.push.outcome }}
          TAR: ${{ steps.dk.outputs.mode == 'original' && 'success' || steps.tar.outcome }}
          UP: ${{ steps.up.outcome }}
          DIGEST: ${{ steps.push.outputs.digest || steps.pushorig.outputs.digest }}
        run: |
          if [ "$MODE" = unavailable ]; then
            { echo "### $TAG / $ARCH"; echo; echo "- ⏭️ $INFO"; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mark() { [ "$1" = success ] && echo "✅" || echo "❌"; }
          {
            echo "### $TAG / $ARCH"
            echo
            echo "- 配方：${INFO:-（准备阶段失败）}"
            echo "- Release tar：$(mark "$UP") napcat-docker-$TAG-$ARCH.tar"
            echo "- GHCR：$(mark "$PUSH") ${DIGEST:-}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DK" != success ] || [ "$PUSH" != success ] || [ "$TAR" != success ] || [ "$UP" != success ]; then
            echo "::error::$TAG / $ARCH 没有全部完成，可直接 Re-run failed jobs"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # GHCR：把每个版本的 amd64 / arm64 合并成一个多架构标签，最新版另打 latest
  # ---------------------------------------------------------------------------
  ghcr:
    needs: [prepare, docker]
    if: ${{ !cancelled() && inputs.mode == 'full' && needs.prepare.outputs.docker_count != '0' }}
    runs-on: ubuntu-latest
    env:
      GHCR_IMAGE: ${{ needs.prepare.outputs.ghcr_image }}
      LATEST: ${{ needs.prepare.outputs.latest }}
      DOCKER_TAGS: ${{ needs.prepare.outputs.docker_matrix }}
    steps:
      - name: Download digests
        continue-on-error: true   # 一个都没成功时没有可下载的
        uses: actions/download-artifact@v7
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create multi-arch tags
        run: |
          d="$RUNNER_TEMP/digests"
          {
            echo "### GHCR：$GHCR_IMAGE"
            echo
            echo "| 版本 | 结果 |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for t in $(jq -r '.[]' <<<"$DOCKER_TAGS"); do
            refs=()
            for arch in amd64 arm64; do
              if [ -s "$d/$t-$arch" ]; then refs+=("$GHCR_IMAGE@$(cat "$d/$t-$arch")"); fi
            done
            if [ ${#refs[@]} -eq 0 ]; then
              # 两个架构都没有镜像：已知补不了的版本（docker 任务里标为跳过），或者两个都失败了（docker 任务会是红的）
              echo "| $t | ⏭️ 两个架构都没有镜像，跳过（原因见对应的 docker 任务） |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if [ ${#refs[@]} -ne 2 ]; then
              echo "| $t | ❌ 只有一个架构（重跑失败的 docker 任务后会自动补上） |" >> "$GITHUB_STEP_SUMMARY"
              failed=1; continue
            fi
            names=("$GHCR_IMAGE:$t")
            if [ "$t" = "$LATEST" ]; then names+=("$GHCR_IMAGE:latest"); fi
            tags=(); for n in "${names[@]}"; do tags+=(-t "$n"); done
            if docker buildx imagetools create "${tags[@]}" "${refs[@]}"; then
              echo "| $t | ✅ ${names[*]} |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $t | ❌ 合并失败 |" >> "$GITHUB_STEP_SUMMARY"; failed=1
            fi
          done
          if [ "$failed" = 1 ]; then exit 1; fi
